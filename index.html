<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChimeraII | Countdown</title>

  <style>
    :root {
      --bg-main: #0b0f14;
      --bg-secondary: #121824;
      --accent: #4fa3ff;
      --text-main: #e6eaf0;
      --text-muted: #9aa4b2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg-main), #05070a);
      color: var(--text-main);
      line-height: 1.6;
      text-align: center;
    }

    header {
      padding: 3rem 1.5rem;
      text-align: center;
      background: radial-gradient(circle at top, #162033, var(--bg-main));
      border-bottom: 1px solid #1f2a44;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 1rem;
      background-color: rgba(18, 24, 36, 0.9);
      position: sticky;
      top: 0;
    }

    nav a {
      color: var(--text-main);
      text-decoration: none;
    }

    section {
      padding: 4rem 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    h2 {
      margin-bottom: 1rem;
      border-left: 4px solid var(--accent);
      padding-left: 1rem;
      text-align: left;
    }

    /* COUNTDOWN */
    .countdown-wrapper {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }

    .time-box {
      background: var(--bg-secondary);
      border: 1px solid #1f2a44;
      border-radius: 12px;
      padding: 1.5rem 2rem;
      min-width: 100px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: transform 0.3s ease;
    }

    .time-box:hover {
      transform: translateY(-5px);
    }

    .time-box span {
      display: block;
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--accent);
    }

    .time-box p {
      margin-top: 0.5rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* TEAM */
    .team-wrapper {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
      margin-top: 2rem;
    }

    .team-card {
      background: var(--bg-secondary);
      border: 1px solid #1f2a44;
      border-radius: 12px;
      padding: 2rem;
      width: 250px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: transform 0.3s ease;
    }

    .team-card:hover {
      transform: translateY(-5px);
    }

    .member-img {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid var(--accent);
      margin-bottom: 1rem;
    }

    .team-card h3 {
      margin-bottom: 0.3rem;
    }

    .team-card p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    @media (max-width: 900px) {
      .team-wrapper {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>CHIMERA<span style="color: var(--accent)">II</span></h1>
  <p>CanSat Wettbewerb 2025/26 – Österreich</p>
</header>

<nav>
  <a href="#">Projekt</a>
  <a href="#">Team</a>
  <a href="#">Primär</a>
  <a href="#">Sekundär</a>
  <a href="#">Galerie</a>
</nav>

<section id="countdown-section">
  <h2>Time Till Launch</h2>

  <div class="countdown-wrapper">
    <div class="time-box">
      <span id="days">0</span>
      <p>Tage</p>
    </div>
    <div class="time-box">
      <span id="hours">0</span>
      <p>Stunden</p>
    </div>
    <div class="time-box">
      <span id="minutes">0</span>
      <p>Minuten</p>
    </div>
    <div class="time-box">
      <span id="seconds">0</span>
      <p>Sekunden</p>
    </div>
  </div>
</section>

<section id="team">
  <h2>Team</h2>

  <div class="team-wrapper">

    <div class="team-card">
      <img src="img/member1.jpg" class="member-img">
      <h3>Max Mustermann</h3>
      <p>Projektleitung</p>
    </div>

    <div class="team-card">
      <img src="img/member2.jpg" class="member-img">
      <h3>Anna Beispiel</h3>
      <p>Software / Sensorik</p>
    </div>

    <div class="team-card">
      <img src="img/member3.jpg" class="member-img">
      <h3>Jonas Test</h3>
      <p>Mechanik / Design</p>
    </div>

  </div>
</section>

<script>
  const countDownDate = new Date("Apr 9, 2026 09:45:00").getTime();

  const x = setInterval(function () {
    const now = new Date().getTime();
    const distance = countDownDate - now;

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById("days").innerHTML = days;
    document.getElementById("hours").innerHTML = hours;
    document.getElementById("minutes").innerHTML = minutes;
    document.getElementById("seconds").innerHTML = seconds;

    if (distance < 0) {
      clearInterval(x);
      document.querySelector(".countdown-wrapper").innerHTML = "🚀 LAUNCHED";
    }
  }, 1000);
</script>

</body>
</html>
